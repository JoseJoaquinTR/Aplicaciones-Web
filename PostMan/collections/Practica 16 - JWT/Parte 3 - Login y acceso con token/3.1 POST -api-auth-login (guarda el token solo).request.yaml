$kind: http-request
name: 3.1 POST /api/auth/login (guarda el token solo)
url: "{{base}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "carlos_dev",
      "password": "1234"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.token) { pm.collectionVariables.set('token', j.token); }
    language: text/javascript
order: 1000
