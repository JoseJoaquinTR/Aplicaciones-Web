<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nebula Music - Registro</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/styles.css">
    </head>
    <body>

        <div class="sky" aria-hidden="true">
            <div class="blob blob--magenta"></div>
            <div class="blob blob--cyan"></div>
            <div class="blob blob--violet"></div>
            <div class="stars"></div>
        </div>

        <main class="auth-container">

            <div class="brand">
                <span class="brand__mark">◐</span>
                <span class="brand__name">Nebula Music</span>
            </div>

            <section class="auth-card">
                <h1>Crear cuenta</h1>
                <p class="auth-card__lead">Arma tu propia constelación de playlists.</p>

                <form method="post" action="/crear-cuenta" novalidate>

                    <div class="field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" minlength="3" placeholder="Tu nombre completo" required>
                        <span class="hint">Mínimo 3 caracteres</span>
                    </div>

                    <div class="field">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="tú@ejemplo.com" required>
                    </div>

                    <div class="field">
                        <label for="contrasenia">Contraseña</label>
                        <input type="password" id="contrasenia" name="contrasenia" placeholder="••••••••" required>
                    </div>

                    <div class="field">
                        <label for="txt_pseudonimo">Pseudónimo</label>
                        <input type="text" id="txt_pseudonimo" name="txt_pseudonimo" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" placeholder="ej. Nova-42" required>
                        <span class="hint">3–10 letras, un guion y 2–10 números (Nova-42)</span>
                    </div>

                    <fieldset class="field field--group">
                        <legend>Género</legend>
                        <div class="radio-row">
                            <label class="radio">
                                <input type="radio" id="masculino" name="rad_genero" value="M" required>
                                <span>Masculino</span>
                            </label>
                            <label class="radio">
                                <input type="radio" id="femenino" name="rad_genero" value="F" required>
                                <span>Femenino</span>
                            </label>
                            <label class="radio">
                                <input type="radio" id="otro" name="rad_genero" value="O" required>
                                <span>Otro</span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- select - lista desplegable -->
                    <!-- option - cada opción dentro del select -->
                    <!-- value - lo que se envía al servidor cuando se elige esa opción -->
                    <div class="field">
                        <label for="sel_suscripcion">Suscripción</label>
                        <select id="sel_suscripcion" name="sel_suscripcion">
                            <option value="gratis">Gratis</option>
                            <option value="mensual">Mensual</option>
                            <option value="anual">Anual</option>
                        </select>
                    </div>

                    <!-- type="date" - muestra un selector de fecha -->
                    <div class="field">
                        <label for="fechaNacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                    </div>

                    <!-- textarea - área de texto de varias líneas -->
                    <!-- rows y cols - tamaño visible del área -->
                    <div class="field">
                        <label for="comentarios">Comentarios</label>
                        <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="¿Algo que quieras contarnos?"></textarea>
                    </div>

                    <!-- type="checkbox" - casilla que se puede marcar o desmarcar -->
                    <label class="check">
                        <input type="checkbox" id="chk_terminos" name="chk_terminos" value="aceptado" required>
                        <span>Acepto los términos y condiciones</span>
                    </label>

                    <div class="actions">
                        <input type="submit" value="Registrar" class="btn btn--primary">
                        <input type="reset" value="Restablecer" class="btn btn--ghost">
                    </div>
                </form>

                <p class="auth-card__switch">¿Ya tienes cuenta? <a href="/inicia-sesion">Inicia sesión</a></p>
            </section>

        </main>

        <footer class="site-footer">
            <p>Copyright Nebula 2026</p>
        </footer>
    </body>
</html>
