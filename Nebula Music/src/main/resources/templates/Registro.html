<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaMusic - Registro</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <nav>
        <a class="logo" href="/index">
            <img src="/imgs/nebula-03.svg" alt="Logo de Nébula">
        </a>

        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-button">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <ul>
            <li><a href="/index">Inicio</a></li>
            <li><a href="/iniciar-sesion">Iniciar sesión</a></li>
            <li><a href="/registro">Registro</a></li>
        </ul>
    </nav>

    <main class="auth-container">
        <section class="auth-card">

            <div class="form-logo">
                <img src="/imgs/nebula-03.svg" alt="Logo de Nébula">
            </div>

            <div class="form-header">
                <h3>Crear cuenta</h3>
                <p class="form-subtitle">Regístrate y empieza a explorar tu órbita musical.</p>
            </div>

            <form class="form" method="post" action="/crear-cuenta">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" minlength="3" placeholder="Tu nombre">
                </div>

                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="tú@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="txt_pseudonimo">Pseudónimo</label>
                    <input type="text" id="txt_pseudonimo" name="txt_pseudonimo"
                           pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                           title="Letras, un guion y números. Ejemplo: Nebula-123"
                           placeholder="Nebula-123">
                    <span class="hint">Letras, un guion y números. Ejemplo: Nebula-123</span>
                </div>

                <fieldset class="form-group">
                    <legend>Género</legend>
                    <div class="radio-row">
                        <label class="radio"><input type="radio" name="rad_genero" value="M"> Masculino</label>
                        <label class="radio"><input type="radio" name="rad_genero" value="F"> Femenino</label>
                        <label class="radio"><input type="radio" name="rad_genero" value="O"> Otro</label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="sel_suscripcion">Suscripción</label>
                    <select id="sel_suscripcion" name="sel_suscripcion">
                        <option value="gratis">Gratis</option>
                        <option value="mensual">Mensual</option>
                        <option value="anual">Anual</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>

                <div class="form-group">
                    <label class="check">
                        <input type="checkbox" name="chk_terminos" value="aceptado">
                        <span>Acepto los términos y condiciones</span>
                    </label>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe aquí tus comentarios..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Registrar</button>
                <button type="reset" class="btn-secondary">Restablecer</button>
            </form>

            <p class="form-switch">¿Ya tienes cuenta? <a href="/iniciar-sesion">Inicia sesión</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nebula 2026</p>
    </footer>

</body>
</html>
