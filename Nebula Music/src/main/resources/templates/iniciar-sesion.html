<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaMusic - Iniciar sesión</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <nav>
        <a class="logo" href="/index">
            <img src="/imgs/nebula-03.svg" alt="Logo de Nébula">
        </a>

        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-button">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <ul>
            <li><a href="/index">Inicio</a></li>
            <li><a href="/iniciar-sesion">Iniciar sesión</a></li>
            <li><a href="/registro">Registro</a></li>
        </ul>
    </nav>

    <main class="auth-container">
        <section class="auth-card">

            <div class="form-logo">
                <img src="/imgs/nebula-03.svg" alt="Logo de Nébula">
            </div>

            <div class="form-header">
                <h3>Iniciar sesión</h3>
                <p class="form-subtitle">Tu órbita musical te está esperando.</p>
            </div>

            <form class="form" method="post" action="/autenticacion" novalidate>

                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="tú@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Iniciar</button>
                <button type="reset" class="btn-secondary">Cancelar</button>
            </form>

            <p class="form-switch">¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nebula 2026</p>
    </footer>

</body>
</html>
